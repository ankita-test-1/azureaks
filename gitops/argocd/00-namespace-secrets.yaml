apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # deploy BEFORE the app, like Pampers' dependsOn
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rathar1/azureaks.git
    targetRevision: main
    path: gitops
    directory:
      include: "namespace.yml,secrets.yml"
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # == Pampers dependsOn
spec:
  project: default
  source:
    repoURL: https://github.com/ankita-test-1/azureaks.git
    targetRevision: main
    path: gitops/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev-blue
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/ankita-test-1/azureaks.git
    targetRevision: main
    path: charts/boutique
    helm:
      valueFiles: [values-dev-blue.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

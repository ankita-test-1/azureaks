apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-api
  namespace: gateway-api
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    - name: boutique-http
      protocol: HTTP
      port: 80
      # No hostname = matches everything on :80. Keeps plain HTTP usable for
      # testing before TLS works. Pampers does the same on their :80 listener.
      allowedRoutes:
        namespaces:
          from: All          # routes live in boutique-<locale>, NOT here
    - name: boutique-https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.aksboutique.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: boutique-tls-cert
            namespace: cert-store
      allowedRoutes:
        namespaces:
          from: All

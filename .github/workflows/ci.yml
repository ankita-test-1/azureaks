name: Boutique CI Pipeline

on:
  workflow_dispatch:

env:
  AZURE_CLIENT_ID: 36572c9f-4e5c-4efb-bb7b-db64021e4dc0
  AZURE_TENANT_ID: 89829357-4296-4e69-b714-fffa2fa6d8b1
  AZURE_SUBSCRIPTION_ID: 19956185-59a5-4243-b32d-572e96134d6e
  ACR_NAME: aksregistryshopping
  ACR_LOGIN_SERVER: aksregistryshopping.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push via ACR
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "Building from $BUILD_PATH"

          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            $BUILD_PATH

  update-manifests:
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG=${{ github.sha }}
          REGISTRY=${{ env.ACR_LOGIN_SERVER }}

          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            sed -i "s|${REGISTRY}/${SERVICE}:.*|${REGISTRY}/${SERVICE}:${NEW_TAG}|g" $MANIFEST
          done

          sed -i "s|${REGISTRY}/frontend:.*|${REGISTRY}/frontend:${NEW_TAG}|g" gitops/k8s/frontend/deployment.yml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

name: Boutique CI Pipeline

on:
  workflow_dispatch:

env:
  AZURE_CLIENT_ID: 36572c9f-4e5c-4efb-bb7b-db64021e4dc0
  AZURE_TENANT_ID: 89829357-4296-4e69-b714-fffa2fa6d8b1
  AZURE_SUBSCRIPTION_ID: 19956185-59a5-4243-b32d-572e96134d6e
  ACR_NAME: aksregistryshopping
  ACR_LOGIN_SERVER: aksregistryshopping.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push via ACR
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "Building from $BUILD_PATH"

          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            $BUILD_PATH

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump imageTag in Helm dev values
        run: |
          NEW_TAG=${{ github.sha }}
          sed -i "s|^imageTag:.*|imageTag: ${NEW_TAG}|" charts/boutique/values-dev.yaml

      - name: Lint rendered Helm output before committing
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm template boutique charts/boutique -f charts/boutique/values-dev.yaml > /tmp/rendered.yaml
          echo "Rendered manifest preview:"
          head -n 40 /tmp/rendered.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/boutique/values-dev.yaml
          git diff --staged --quiet || git commit -m "ci: bump dev image tag to ${{ github.sha }}"
          git push

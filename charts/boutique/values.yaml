# Base values shared by every locale and colour.
# The ApplicationSet overrides `locale` and `color` per generated Application.

# --- identity (overridden by ApplicationSet parameters) ---------------------
locale: en-us
color: blue

# --- traffic split ----------------------------------------------------------
# Only read from the BLUE release - blue owns the HTTPRoute for its locale.
# This is the cutover switch: flip to blue:0 / green:100 to shift traffic.
traffic:
  blue: 100
  green: 0

# --- gateway ----------------------------------------------------------------
gateway:
  name: gateway-api
  namespace: gateway-api
domain: internal.aksboutique.com

# --- images -----------------------------------------------------------------
imageRegistry: aksregistryshopping.azurecr.io
imageTag: latest   # overwritten by CI on every build

# Which service receives external traffic for the locale hostname.
publicService: frontend

services:
  - name: gateway
    port: 3001
    replicas: 1
  - name: auth
    port: 3002
    replicas: 1
  - name: product-service
    port: 3003
    replicas: 1
  - name: order-service
    port: 3004
    replicas: 1
  - name: orders
    port: 3005
    replicas: 1
  - name: user-service
    port: 3006
    replicas: 1
  - name: frontend
    port: 3000
    replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

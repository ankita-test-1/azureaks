# Base values - shared defaults for every environment.
# Env-specific overrides live in values-dev.yaml / values-prod.yaml.

namespace: boutique
imageRegistry: aksregistryshopping.azurecr.io
imageTag: latest   # overwritten by CI on every build

services:
  - name: gateway
    port: 3001
    replicas: 1
  - name: auth
    port: 3002
    replicas: 1
  - name: product-service
    port: 3003
    replicas: 1
  - name: order-service
    port: 3004
    replicas: 1
  - name: orders
    port: 3005
    replicas: 1
  - name: user-service
    port: 3006
    replicas: 1
  - name: frontend
    port: 3000
    replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

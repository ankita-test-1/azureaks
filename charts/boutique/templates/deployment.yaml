{{- range $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Colour suffix keeps blue and green from overwriting each other.
  name: {{ $svc.name }}-{{ $.Values.color }}
  labels:
    app: {{ $svc.name }}
    color: {{ $.Values.color }}
    locale: {{ $.Values.locale }}
    app.kubernetes.io/part-of: boutique
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
      color: {{ $.Values.color }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        color: {{ $.Values.color }}
        locale: {{ $.Values.locale }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: "{{ $.Values.imageRegistry }}/{{ $svc.name }}:{{ $.Values.imageTag }}"
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: LOCALE
              value: {{ $.Values.locale | quote }}
            - name: COLOR
              value: {{ $.Values.color | quote }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
{{- end }}

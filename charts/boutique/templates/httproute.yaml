apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boutique-{{ .Values.locale }}
spec:
  parentRefs:
    - name: gateway-api
      namespace: gateway-api
  hostnames:
    - "{{ .Values.locale }}.internal.aksboutique.com"
  rules:
    - backendRefs:
        - name: boutique-{{ .Values.locale }}-blue
          port: 80
          weight: {{ .Values.traffic.blue }}
        - name: boutique-{{ .Values.locale }}-green
          port: 80
          weight: {{ .Values.traffic.green }}

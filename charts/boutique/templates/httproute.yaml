apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "boutique.fullname" . }}
spec:
  parentRefs:
    - name: gateway-api
      namespace: gateway-api
  rules:
    - backendRefs:
        - name: {{ include "boutique.fullname" . }}-blue
          port: 80
          weight: {{ .Values.traffic.blue }}
        - name: {{ include "boutique.fullname" . }}-green
          port: 80
          weight: {{ .Values.traffic.green }}

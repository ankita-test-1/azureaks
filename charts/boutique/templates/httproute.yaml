{{- /*
  One HTTPRoute per LOCALE, not per colour - it is the thing that splits
  traffic between them, so it cannot be owned by both.
  Rendered only by the BLUE release; green renders nothing here.
  Weights come from the blue release's values => that file is the cutover switch.
*/ -}}
{{- if eq .Values.color "blue" }}
{{- $public := .Values.publicService }}
{{- $port := 0 }}
{{- range .Values.services }}
  {{- if eq .name $public }}{{ $port = .port }}{{ end }}
{{- end }}
{{- if eq $port 0 }}
  {{- fail (printf "publicService %q not found in .Values.services" $public) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boutique-{{ .Values.locale }}
  labels:
    locale: {{ .Values.locale }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.locale }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ $public }}-blue
          port: {{ $port }}
          weight: {{ .Values.traffic.blue }}
        - name: {{ $public }}-green
          port: {{ $port }}
          weight: {{ .Values.traffic.green }}
{{- end }}

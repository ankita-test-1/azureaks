{{- range $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}-{{ $.Values.color }}
  labels:
    app: {{ $svc.name }}
    color: {{ $.Values.color }}
    locale: {{ $.Values.locale }}
spec:
  selector:
    app: {{ $svc.name }}
    color: {{ $.Values.color }}   # must match the Deployment selector
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
